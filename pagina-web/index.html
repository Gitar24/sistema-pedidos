<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comandas</title>
  <link rel="stylesheet" href="estilo.css">
  <!-- Uma página só, com três abas: Novo pedido, Pedidos e Cadastrar item -->
</head>
<body>
  <header>
    <h1>Comandas</h1>
    <span id="estado-servidor" class="estado-servidor" title="Conexão com o servidor">Conectando...</span>
  </header>

  <!-- Faixa de aviso (sucesso, aviso, erro ou conexão). Fica fixa no topo e dá para fechar. -->
  <div id="mensagem" class="mensagem oculto" role="alert">
    <span id="mensagem-texto"></span>
    <button id="mensagem-fechar" class="fechar" aria-label="Fechar aviso">&times;</button>
  </div>

  <!-- Abas: cada tela fica separada para ninguém tocar em Cancelar ou Reimprimir sem
       querer enquanto atende. Quem troca de aba é o js/abas.js. -->
  <nav class="abas" role="tablist" aria-label="Telas do sistema">
    <button class="aba ativa" role="tab" id="aba-novo" data-painel="painel-novo" aria-selected="true">Novo pedido</button>
    <button class="aba" role="tab" id="aba-recentes" data-painel="painel-recentes" aria-selected="false">
      Pedidos <span id="contagem-nao-impressos" class="contagem oculto" title="Pedidos que ainda não foram impressos"></span>
    </button>
    <button class="aba" role="tab" id="aba-cadastro" data-painel="painel-cadastro" aria-selected="false">Cadastrar item</button>
  </nav>

  <main>
    <!-- Aba 1: mesa, itens e envio, de cima para baixo -->
    <div class="painel" id="painel-novo" role="tabpanel" aria-labelledby="aba-novo">
      <section class="cartao">
        <label class="campo-mesa" for="mesa">Mesa</label>
        <input id="mesa" maxlength="12" inputmode="numeric" autocomplete="off" placeholder="Número da mesa">
      </section>

      <section class="cartao" id="cartao-cardapio">
        <h2>Cardápio</h2>
        <ul id="lista-cardapio" class="lista"></ul>
        <p id="cardapio-vazio" class="discreto oculto">Nenhum item no cardápio.</p>
      </section>

      <section class="cartao" id="cartao-pedido">
        <h2>Pedido</h2>
        <ul id="lista-pedido" class="lista"></ul>
        <p id="pedido-vazio" class="discreto">Toque em "Adicionar" no cardápio.</p>
        <div class="total-linha"><span>Total</span><strong id="total-pedido">R$ 0,00</strong></div>
        <button id="botao-limpar" class="btn btn-neutro" disabled>Limpar pedido</button>
      </section>

      <!-- Fica presa no pé da tela, ao alcance do polegar -->
      <div class="barra-enviar">
        <button id="botao-registrar" class="btn btn-confirmar" disabled>Enviar para a cozinha</button>
      </div>
    </div>

    <!-- Aba 2: histórico, reimprimir e cancelar -->
    <div class="painel oculto" id="painel-recentes" role="tabpanel" aria-labelledby="aba-recentes">
      <section class="cartao">
        <button id="botao-atualizar" class="btn btn-neutro">Atualizar lista</button>
        <ul id="lista-pedidos" class="lista"></ul>
        <p id="pedidos-vazio" class="discreto oculto">Nenhum pedido ainda.</p>
      </section>
    </div>

    <!-- Aba 3: cadastrar um item novo no cardápio -->
    <div class="painel oculto" id="painel-cadastro" role="tabpanel" aria-labelledby="aba-cadastro">
      <section class="cartao">
        <h2>Item novo no cardápio</h2>
        <form id="form-item">
          <label>Nome <input name="nome" maxlength="60" required></label>
          <label>Preço (R$) <input name="preco" inputmode="decimal" placeholder="12,50" required></label>
          <button type="submit" class="btn btn-adicionar">Cadastrar</button>
        </form>
      </section>
    </div>
  </main>

  <!-- A ordem importa: ferramentas vem primeiro e iniciar-pagina por último -->
  <script src="js/ferramentas.js"></script>
  <script src="js/cardapio.js"></script>
  <script src="js/pedido-atual.js"></script>
  <script src="js/pedidos-recentes.js"></script>
  <script src="js/cadastro-de-item.js"></script>
  <script src="js/abas.js"></script>
  <script src="js/ver-nota-temporario.js"></script> <!-- temporário -->
  <script src="js/iniciar-pagina.js"></script>
</body>
</html>
